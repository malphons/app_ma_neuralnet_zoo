<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Convolutional Neural Network Thumbnail -->

  <!-- Connections: Input to Conv1 -->
  <g class="nn-layer">
    <line class="nn-edge" x1="42" y1="60" x2="98" y2="40" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="42" y1="60" x2="98" y2="80" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="42" y1="60" x2="98" y2="120" stroke="#58a6ff" stroke-width="1" opacity="0.1"/>
    <line class="nn-edge" x1="42" y1="60" x2="98" y2="160" stroke="#58a6ff" stroke-width="1" opacity="0.1"/>
    <line class="nn-edge" x1="42" y1="125" x2="98" y2="40" stroke="#58a6ff" stroke-width="1" opacity="0.1"/>
    <line class="nn-edge" x1="42" y1="125" x2="98" y2="80" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="42" y1="125" x2="98" y2="120" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="42" y1="125" x2="98" y2="160" stroke="#58a6ff" stroke-width="1" opacity="0.1"/>
    <line class="nn-edge" x1="42" y1="190" x2="98" y2="40" stroke="#58a6ff" stroke-width="1" opacity="0.1"/>
    <line class="nn-edge" x1="42" y1="190" x2="98" y2="80" stroke="#58a6ff" stroke-width="1" opacity="0.1"/>
    <line class="nn-edge" x1="42" y1="190" x2="98" y2="120" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="42" y1="190" x2="98" y2="160" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
  </g>

  <!-- Connections: Conv1 to Pool1 -->
  <g class="nn-layer">
    <line class="nn-edge" x1="118" y1="40" x2="148" y2="50" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="118" y1="80" x2="148" y2="90" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="118" y1="120" x2="148" y2="120" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="118" y1="160" x2="148" y2="150" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
  </g>

  <!-- Connections: Pool1 to Conv2 -->
  <g class="nn-layer">
    <line class="nn-edge" x1="168" y1="50" x2="218" y2="30" stroke="#58a6ff" stroke-width="1" opacity="0.12"/>
    <line class="nn-edge" x1="168" y1="50" x2="218" y2="70" stroke="#58a6ff" stroke-width="1" opacity="0.12"/>
    <line class="nn-edge" x1="168" y1="90" x2="218" y2="70" stroke="#58a6ff" stroke-width="1" opacity="0.12"/>
    <line class="nn-edge" x1="168" y1="90" x2="218" y2="110" stroke="#58a6ff" stroke-width="1" opacity="0.12"/>
    <line class="nn-edge" x1="168" y1="120" x2="218" y2="110" stroke="#58a6ff" stroke-width="1" opacity="0.12"/>
    <line class="nn-edge" x1="168" y1="120" x2="218" y2="150" stroke="#58a6ff" stroke-width="1" opacity="0.12"/>
    <line class="nn-edge" x1="168" y1="150" x2="218" y2="150" stroke="#58a6ff" stroke-width="1" opacity="0.12"/>
    <line class="nn-edge" x1="168" y1="150" x2="218" y2="190" stroke="#58a6ff" stroke-width="1" opacity="0.12"/>
  </g>

  <!-- Connections: Conv2 to Pool2 -->
  <g class="nn-layer">
    <line class="nn-edge" x1="238" y1="30" x2="268" y2="45" stroke="#58a6ff" stroke-width="1" opacity="0.12"/>
    <line class="nn-edge" x1="238" y1="70" x2="268" y2="80" stroke="#58a6ff" stroke-width="1" opacity="0.12"/>
    <line class="nn-edge" x1="238" y1="110" x2="268" y2="115" stroke="#58a6ff" stroke-width="1" opacity="0.12"/>
    <line class="nn-edge" x1="238" y1="150" x2="268" y2="150" stroke="#58a6ff" stroke-width="1" opacity="0.12"/>
    <line class="nn-edge" x1="238" y1="190" x2="268" y2="180" stroke="#58a6ff" stroke-width="1" opacity="0.12"/>
  </g>

  <!-- Connections: Pool2 to Dense -->
  <g class="nn-layer">
    <line class="nn-edge" x1="283" y1="45" x2="328" y2="85" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="283" y1="80" x2="328" y2="85" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="283" y1="115" x2="328" y2="85" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="283" y1="115" x2="328" y2="125" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="283" y1="150" x2="328" y2="125" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="283" y1="150" x2="328" y2="165" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="283" y1="180" x2="328" y2="165" stroke="#58a6ff" stroke-width="1" opacity="0.15"/>
  </g>

  <!-- Connections: Dense to Output -->
  <g class="nn-layer">
    <line class="nn-edge" x1="342" y1="85" x2="372" y2="105" stroke="#58a6ff" stroke-width="1.5" opacity="0.2"/>
    <line class="nn-edge" x1="342" y1="85" x2="372" y2="145" stroke="#58a6ff" stroke-width="1.5" opacity="0.15"/>
    <line class="nn-edge" x1="342" y1="125" x2="372" y2="105" stroke="#58a6ff" stroke-width="1.5" opacity="0.2"/>
    <line class="nn-edge" x1="342" y1="125" x2="372" y2="145" stroke="#58a6ff" stroke-width="1.5" opacity="0.2"/>
    <line class="nn-edge" x1="342" y1="165" x2="372" y2="105" stroke="#58a6ff" stroke-width="1.5" opacity="0.15"/>
    <line class="nn-edge" x1="342" y1="165" x2="372" y2="145" stroke="#58a6ff" stroke-width="1.5" opacity="0.2"/>
  </g>

  <!-- Input layer: tall rectangle (image) -->
  <rect class="nn-node" x="22" y="40" width="20" height="170" rx="3" fill="#58a6ff" opacity="0.35"/>

  <!-- Conv1: feature map rectangles -->
  <rect class="nn-node" x="98" y="28" width="16" height="32" rx="2" fill="#58a6ff" opacity="0.5"/>
  <rect class="nn-node" x="98" y="68" width="16" height="32" rx="2" fill="#58a6ff" opacity="0.5"/>
  <rect class="nn-node" x="98" y="108" width="16" height="32" rx="2" fill="#58a6ff" opacity="0.5"/>
  <rect class="nn-node" x="98" y="148" width="16" height="32" rx="2" fill="#58a6ff" opacity="0.5"/>

  <!-- Pool1: smaller rectangles (downsampled) -->
  <rect class="nn-node" x="150" y="40" width="12" height="24" rx="2" fill="#58a6ff" opacity="0.45"/>
  <rect class="nn-node" x="150" y="80" width="12" height="24" rx="2" fill="#58a6ff" opacity="0.45"/>
  <rect class="nn-node" x="150" y="110" width="12" height="24" rx="2" fill="#58a6ff" opacity="0.45"/>
  <rect class="nn-node" x="150" y="140" width="12" height="24" rx="2" fill="#58a6ff" opacity="0.45"/>

  <!-- Conv2: feature map rectangles (more maps, smaller) -->
  <rect class="nn-node" x="220" y="20" width="14" height="26" rx="2" fill="#58a6ff" opacity="0.6"/>
  <rect class="nn-node" x="220" y="58" width="14" height="26" rx="2" fill="#58a6ff" opacity="0.6"/>
  <rect class="nn-node" x="220" y="98" width="14" height="26" rx="2" fill="#58a6ff" opacity="0.6"/>
  <rect class="nn-node" x="220" y="138" width="14" height="26" rx="2" fill="#58a6ff" opacity="0.6"/>
  <rect class="nn-node" x="220" y="178" width="14" height="26" rx="2" fill="#58a6ff" opacity="0.6"/>

  <!-- Pool2: smaller rectangles -->
  <rect class="nn-node" x="268" y="36" width="10" height="20" rx="2" fill="#58a6ff" opacity="0.55"/>
  <rect class="nn-node" x="268" y="72" width="10" height="20" rx="2" fill="#58a6ff" opacity="0.55"/>
  <rect class="nn-node" x="268" y="106" width="10" height="20" rx="2" fill="#58a6ff" opacity="0.55"/>
  <rect class="nn-node" x="268" y="142" width="10" height="20" rx="2" fill="#58a6ff" opacity="0.55"/>
  <rect class="nn-node" x="268" y="172" width="10" height="20" rx="2" fill="#58a6ff" opacity="0.55"/>

  <!-- Dense layer: circles -->
  <circle class="nn-node" cx="335" cy="85" r="9" fill="#58a6ff" opacity="0.75"/>
  <circle class="nn-node" cx="335" cy="125" r="9" fill="#58a6ff" opacity="0.75"/>
  <circle class="nn-node" cx="335" cy="165" r="9" fill="#58a6ff" opacity="0.75"/>

  <!-- Output layer: circles -->
  <circle class="nn-node" cx="378" cy="105" r="9" fill="#58a6ff" opacity="0.95"/>
  <circle class="nn-node" cx="378" cy="145" r="9" fill="#58a6ff" opacity="0.95"/>

  <!-- Layer labels -->
  <text class="nn-label" x="32" y="235" text-anchor="middle" fill="#58a6ff" font-size="8" opacity="0.4" font-family="sans-serif">Input</text>
  <text class="nn-label" x="106" y="235" text-anchor="middle" fill="#58a6ff" font-size="8" opacity="0.4" font-family="sans-serif">Conv1</text>
  <text class="nn-label" x="156" y="235" text-anchor="middle" fill="#58a6ff" font-size="8" opacity="0.4" font-family="sans-serif">Pool</text>
  <text class="nn-label" x="227" y="235" text-anchor="middle" fill="#58a6ff" font-size="8" opacity="0.4" font-family="sans-serif">Conv2</text>
  <text class="nn-label" x="273" y="235" text-anchor="middle" fill="#58a6ff" font-size="8" opacity="0.4" font-family="sans-serif">Pool</text>
  <text class="nn-label" x="335" y="235" text-anchor="middle" fill="#58a6ff" font-size="8" opacity="0.4" font-family="sans-serif">Dense</text>
  <text class="nn-label" x="378" y="235" text-anchor="middle" fill="#58a6ff" font-size="8" opacity="0.4" font-family="sans-serif">Out</text>
</svg>
