    <line class="nn-edge" x1="158" y1="40" x2="228" y2="210" stroke="#8b949e" stroke-width="1" opacity="0.1"/>
    <line class="nn-edge" x1="158" y1="90" x2="228" y2="60" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="158" y1="90" x2="228" y2="110" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="158" y1="90" x2="228" y2="160" stroke="#8b949e" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="158" y1="90" x2="228" y2="210" stroke="#8b949e" stroke-width="1" opacity="0.1"/>
    <line class="nn-edge" x1="158" y1="140" x2="228" y2="60" stroke="#8b949e" stroke-width="1" opacity="0.1"/>
    <line class="nn-edge" x1="158" y1="140" x2="228" y2="110" stroke="#8b949e" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="158" y1="140" x2="228" y2="160" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="158" y1="140" x2="228" y2="210" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="158" y1="190" x2="228" y2="60" stroke="#8b949e" stroke-width="1" opacity="0.1"/>
    <line class="nn-edge" x1="158" y1="190" x2="228" y2="110" stroke="#8b949e" stroke-width="1" opacity="0.1"/>
    <line class="nn-edge" x1="158" y1="190" x2="228" y2="160" stroke="#8b949e" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="158" y1="190" x2="228" y2="210" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Connections: Hidden 2 to Output 1 -->
  <g class="nn-layer">
    <line class="nn-edge" x1="248" y1="60" x2="308" y2="90" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
