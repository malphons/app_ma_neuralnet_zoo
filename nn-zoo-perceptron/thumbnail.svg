    <line class="nn-edge" x1="248" y1="110" x2="308" y2="90" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="248" y1="110" x2="308" y2="160" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="248" y1="160" x2="308" y2="90" stroke="#8b949e" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="248" y1="160" x2="308" y2="160" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="248" y1="210" x2="308" y2="90" stroke="#8b949e" stroke-width="1" opacity="0.1"/>
    <line class="nn-edge" x1="248" y1="210" x2="308" y2="160" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Connections: Output 1 to Output -->
  <g class="nn-layer">
    <line class="nn-edge" x1="328" y1="90" x2="368" y2="125" stroke="#8b949e" stroke-width="1.5" opacity="0.25"/>
    <line class="nn-edge" x1="328" y1="160" x2="368" y2="125" stroke="#8b949e" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- Input layer nodes -->
  <circle class="nn-node" cx="50" cy="50" r="10" fill="#8b949e" opacity="0.45"/>
  <circle class="nn-node" cx="50" cy="120" r="10" fill="#8b949e" opacity="0.45"/>
  <circle class="nn-node" cx="50" cy="190" r="10" fill="#8b949e" opacity="0.45"/>

  <!-- Hidden layer 1 nodes -->
  <circle class="nn-node" cx="148" cy="40" r="10" fill="#8b949e" opacity="0.6"/>
  <circle class="nn-node" cx="148" cy="90" r="10" fill="#8b949e" opacity="0.6"/>
  <circle class="nn-node" cx="148" cy="140" r="10" fill="#8b949e" opacity="0.6"/>
  <circle class="nn-node" cx="148" cy="190" r="10" fill="#8b949e" opacity="0.6"/>

  <!-- Hidden layer 2 nodes -->
  <circle class="nn-node" cx="238" cy="60" r="10" fill="#8b949e" opacity="0.7"/>
  <circle class="nn-node" cx="238" cy="110" r="10" fill="#8b949e" opacity="0.7"/>
  <circle class="nn-node" cx="238" cy="160" r="10" fill="#8b949e" opacity="0.7"/>
  <circle class="nn-node" cx="238" cy="210" r="10" fill="#8b949e" opacity="0.7"/>

  <!-- Pre-output nodes -->
  <circle class="nn-node" cx="318" cy="90" r="10" fill="#8b949e" opacity="0.85"/>
  <circle class="nn-node" cx="318" cy="160" r="10" fill="#8b949e" opacity="0.85"/>

  <!-- Output node -->
  <circle class="nn-node" cx="378" cy="125" r="10" fill="#8b949e" opacity="1"/>

  <!-- Layer labels -->
  <text class="nn-label" x="50" y="235" text-anchor="middle" fill="#8b949e" font-size="9" opacity="0.4" font-family="sans-serif">Input</text>
  <text class="nn-label" x="148" y="235" text-anchor="middle" fill="#8b949e" font-size="9" opacity="0.4" font-family="sans-serif">Hidden 1</text>
  <text class="nn-label" x="238" y="235" text-anchor="middle" fill="#8b949e" font-size="9" opacity="0.4" font-family="sans-serif">Hidden 2</text>
  <text class="nn-label" x="348" y="235" text-anchor="middle" fill="#8b949e" font-size="9" opacity="0.4" font-family="sans-serif">Output</text>
</svg>
