<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Perceptron / MLP Thumbnail: 3-4-4-2-1 network -->

  <!-- Connections: Input to Hidden 1 -->
  <g class="nn-layer">
    <line class="nn-edge" x1="62" y1="50" x2="138" y2="40" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="62" y1="50" x2="138" y2="90" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="62" y1="50" x2="138" y2="140" stroke="#8b949e" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="62" y1="50" x2="138" y2="190" stroke="#8b949e" stroke-width="1" opacity="0.1"/>
    <line class="nn-edge" x1="62" y1="120" x2="138" y2="40" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="62" y1="120" x2="138" y2="90" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="62" y1="120" x2="138" y2="140" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="62" y1="120" x2="138" y2="190" stroke="#8b949e" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="62" y1="190" x2="138" y2="40" stroke="#8b949e" stroke-width="1" opacity="0.1"/>
    <line class="nn-edge" x1="62" y1="190" x2="138" y2="90" stroke="#8b949e" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="62" y1="190" x2="138" y2="140" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="62" y1="190" x2="138" y2="190" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Connections: Hidden 1 to Hidden 2 -->
  <g class="nn-layer">
    <line class="nn-edge" x1="158" y1="40" x2="228" y2="60" stroke="#8b949e" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="158" y1="40" x2="228" y2="110" stroke="#8b949e" stroke-width="1" opacity="0.15"/>
