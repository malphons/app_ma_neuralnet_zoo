<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Transformer Thumbnail: Stacked encoder blocks with attention -->

  <!-- Input embeddings at bottom -->
  <circle class="nn-node" cx="120" cy="220" r="8" fill="#f0883e" opacity="0.3"/>
  <circle class="nn-node" cx="170" cy="220" r="8" fill="#f0883e" opacity="0.3"/>
  <circle class="nn-node" cx="220" cy="220" r="8" fill="#f0883e" opacity="0.3"/>
  <circle class="nn-node" cx="270" cy="220" r="8" fill="#f0883e" opacity="0.3"/>

  <!-- Positional encoding arrows up -->
  <g class="nn-layer">
    <line class="nn-edge" x1="120" y1="210" x2="120" y2="185" stroke="#f0883e" stroke-width="1" opacity="0.25"/>
    <line class="nn-edge" x1="170" y1="210" x2="170" y2="185" stroke="#f0883e" stroke-width="1" opacity="0.25"/>
    <line class="nn-edge" x1="220" y1="210" x2="220" y2="185" stroke="#f0883e" stroke-width="1" opacity="0.25"/>
    <line class="nn-edge" x1="270" y1="210" x2="270" y2="185" stroke="#f0883e" stroke-width="1" opacity="0.25"/>
  </g>

  <!-- Block 1: Multi-Head Attention -->
  <rect class="nn-node" x="100" y="155" width="190" height="30" rx="6" fill="#f0883e" opacity="0.25" stroke="#f0883e" stroke-width="1"/>
  <text x="195" y="174" text-anchor="middle" fill="#f0883e" font-size="8" font-family="sans-serif" opacity="0.7">Multi-Head Attention</text>

  <!-- Add & Norm -->
  <rect x="100" y="128" width="190" height="18" rx="4" fill="#f0883e" opacity="0.12"/>
  <text x="195" y="140" text-anchor="middle" fill="#f0883e" font-size="7" font-family="sans-serif" opacity="0.5">Add &amp; Norm</text>

  <!-- Block 1: FFN -->
  <rect class="nn-node" x="100" y="100" width="190" height="22" rx="6" fill="#f0883e" opacity="0.35" stroke="#f0883e" stroke-width="1"/>
  <text x="195" y="115" text-anchor="middle" fill="#f0883e" font-size="8" font-family="sans-serif" opacity="0.7">Feed Forward</text>

  <!-- Add & Norm 2 -->
  <rect x="100" y="78" width="190" height="18" rx="4" fill="#f0883e" opacity="0.12"/>
  <text x="195" y="90" text-anchor="middle" fill="#f0883e" font-size="7" font-family="sans-serif" opacity="0.5">Add &amp; Norm</text>

  <!-- Block 2: Attention (stacked, more opaque) -->
  <rect class="nn-node" x="100" y="48" width="190" height="24" rx="6" fill="#f0883e" opacity="0.5" stroke="#f0883e" stroke-width="1"/>
  <text x="195" y="64" text-anchor="middle" fill="#f0883e" font-size="8" font-family="sans-serif" opacity="0.8">Multi-Head Attention</text>

  <!-- Block 2: FFN -->
  <rect class="nn-node" x="100" y="18" width="190" height="24" rx="6" fill="#f0883e" opacity="0.65" stroke="#f0883e" stroke-width="1"/>
  <text x="195" y="34" text-anchor="middle" fill="#f0883e" font-size="8" font-family="sans-serif" opacity="0.9">Feed Forward</text>

  <!-- Attention arrows (Q, K, V) connecting to attention block -->
  <g class="nn-layer">
    <line class="nn-edge" x1="130" y1="185" x2="140" y2="185" stroke="#f0883e" stroke-width="1" opacity="0.3"/>
    <line class="nn-edge" x1="190" y1="185" x2="195" y2="185" stroke="#f0883e" stroke-width="1" opacity="0.3"/>
    <line class="nn-edge" x1="250" y1="185" x2="250" y2="185" stroke="#f0883e" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Skip connection arcs (right side) -->
  <path class="nn-edge" d="M295 170 Q 320 155 295 142" fill="none" stroke="#f0883e" stroke-width="1" opacity="0.2" stroke-dasharray="3,3"/>
  <path class="nn-edge" d="M295 115 Q 320 100 295 92" fill="none" stroke="#f0883e" stroke-width="1" opacity="0.2" stroke-dasharray="3,3"/>

  <!-- Nx label -->
  <text x="330" y="125" fill="#f0883e" font-size="10" font-family="sans-serif" opacity="0.4">Nx</text>

  <!-- Labels -->
  <text class="nn-label" x="195" y="245" text-anchor="middle" fill="#f0883e" font-size="9" opacity="0.4" font-family="sans-serif">Input Embeddings + Positional Encoding</text>
</svg>
