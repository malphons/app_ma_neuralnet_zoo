<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!--
    Neural Network Zoo - Thumbnail Template
    Conventions:
    - ViewBox must be 0 0 400 250
    - Use class="nn-node" for neuron circles/rects
    - Use class="nn-edge" for connection lines/paths
    - Use class="nn-layer" for layer groups
    - Use currentColor or category color for theming
    - Keep under 10KB
  -->
  <g class="nn-layer">
    <!-- Input layer -->
    <circle class="nn-node" cx="80" cy="65" r="12" fill="currentColor" opacity="0.5"/>
    <circle class="nn-node" cx="80" cy="125" r="12" fill="currentColor" opacity="0.5"/>
    <circle class="nn-node" cx="80" cy="185" r="12" fill="currentColor" opacity="0.5"/>

    <!-- Hidden layer -->
    <circle class="nn-node" cx="200" cy="85" r="12" fill="currentColor" opacity="0.7"/>
    <circle class="nn-node" cx="200" cy="165" r="12" fill="currentColor" opacity="0.7"/>

    <!-- Output layer -->
    <circle class="nn-node" cx="320" cy="125" r="12" fill="currentColor"/>
  </g>

  <g class="nn-layer">
    <!-- Connections -->
    <line class="nn-edge" x1="92" y1="65" x2="188" y2="85" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <line class="nn-edge" x1="92" y1="65" x2="188" y2="165" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <line class="nn-edge" x1="92" y1="125" x2="188" y2="85" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <line class="nn-edge" x1="92" y1="125" x2="188" y2="165" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <line class="nn-edge" x1="92" y1="185" x2="188" y2="85" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <line class="nn-edge" x1="92" y1="185" x2="188" y2="165" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <line class="nn-edge" x1="212" y1="85" x2="308" y2="125" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
    <line class="nn-edge" x1="212" y1="165" x2="308" y2="125" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Layer labels (optional, shown on deep-dive) -->
  <text class="nn-label" x="80" y="230" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.4">Input</text>
  <text class="nn-label" x="200" y="230" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.4">Hidden</text>
  <text class="nn-label" x="320" y="230" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.4">Output</text>
</svg>
