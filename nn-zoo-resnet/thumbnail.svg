<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- ResNet Thumbnail: Conv blocks with skip connections -->

  <!-- Input -->
  <rect class="nn-node" x="15" y="90" width="35" height="70" rx="6" fill="#58a6ff" opacity="0.3" stroke="#58a6ff" stroke-width="1"/>
  <text x="32" y="130" text-anchor="middle" fill="#58a6ff" font-size="7" font-family="sans-serif" opacity="0.5">Input</text>

  <!-- Conv stem -->
  <rect class="nn-node" x="70" y="95" width="30" height="60" rx="5" fill="#58a6ff" opacity="0.4" stroke="#58a6ff" stroke-width="1"/>

  <!-- Connection: input to conv stem -->
  <line class="nn-edge" x1="50" y1="125" x2="70" y2="125" stroke="#58a6ff" stroke-width="1.5" opacity="0.25"/>

  <!-- ResBlock 1 -->
  <rect class="nn-node" x="120" y="85" width="55" height="80" rx="6" fill="#58a6ff" opacity="0.45" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="147" y="118" text-anchor="middle" fill="#58a6ff" font-size="7" font-family="sans-serif" opacity="0.6">Conv</text>
  <text x="147" y="130" text-anchor="middle" fill="#58a6ff" font-size="7" font-family="sans-serif" opacity="0.6">BN+ReLU</text>
  <text x="147" y="142" text-anchor="middle" fill="#58a6ff" font-size="7" font-family="sans-serif" opacity="0.6">Conv</text>

  <!-- Skip connection 1 (arc over block) -->
  <path class="nn-edge" d="M 100 95 Q 147 40 175 95" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.35" stroke-dasharray="4,3"/>
  <circle cx="100" cy="95" r="2" fill="#58a6ff" opacity="0.5"/>

  <!-- Connection stem->block1 -->
  <line class="nn-edge" x1="100" y1="125" x2="120" y2="125" stroke="#58a6ff" stroke-width="1.5" opacity="0.25"/>

  <!-- ResBlock 2 -->
  <rect class="nn-node" x="195" y="85" width="55" height="80" rx="6" fill="#58a6ff" opacity="0.55" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="222" y="118" text-anchor="middle" fill="#58a6ff" font-size="7" font-family="sans-serif" opacity="0.7">Conv</text>
  <text x="222" y="130" text-anchor="middle" fill="#58a6ff" font-size="7" font-family="sans-serif" opacity="0.7">BN+ReLU</text>
  <text x="222" y="142" text-anchor="middle" fill="#58a6ff" font-size="7" font-family="sans-serif" opacity="0.7">Conv</text>

  <!-- Skip connection 2 -->
  <path class="nn-edge" d="M 175 95 Q 222 40 250 95" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,3"/>
  <circle cx="175" cy="95" r="2" fill="#58a6ff" opacity="0.5"/>

  <!-- Connection block1->block2 -->
  <line class="nn-edge" x1="175" y1="125" x2="195" y2="125" stroke="#58a6ff" stroke-width="1.5" opacity="0.3"/>

  <!-- ResBlock 3 -->
  <rect class="nn-node" x="270" y="85" width="55" height="80" rx="6" fill="#58a6ff" opacity="0.65" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="297" y="118" text-anchor="middle" fill="#58a6ff" font-size="7" font-family="sans-serif" opacity="0.8">Conv</text>
  <text x="297" y="130" text-anchor="middle" fill="#58a6ff" font-size="7" font-family="sans-serif" opacity="0.8">BN+ReLU</text>
  <text x="297" y="142" text-anchor="middle" fill="#58a6ff" font-size="7" font-family="sans-serif" opacity="0.8">Conv</text>

  <!-- Skip connection 3 -->
  <path class="nn-edge" d="M 250 95 Q 297 40 325 95" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.45" stroke-dasharray="4,3"/>
  <circle cx="250" cy="95" r="2" fill="#58a6ff" opacity="0.5"/>

  <!-- Connection block2->block3 -->
  <line class="nn-edge" x1="250" y1="125" x2="270" y2="125" stroke="#58a6ff" stroke-width="1.5" opacity="0.35"/>

  <!-- Global Avg Pool + Dense -->
  <rect class="nn-node" x="345" y="100" width="30" height="50" rx="5" fill="#58a6ff" opacity="0.75" stroke="#58a6ff" stroke-width="1"/>
  <circle class="nn-node" cx="390" cy="125" r="8" fill="#58a6ff" opacity="0.9"/>

  <!-- Connection block3->pool->output -->
  <line class="nn-edge" x1="325" y1="125" x2="345" y2="125" stroke="#58a6ff" stroke-width="1.5" opacity="0.4"/>
  <line class="nn-edge" x1="375" y1="125" x2="382" y2="125" stroke="#58a6ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Labels -->
  <text class="nn-label" x="85" y="180" text-anchor="middle" fill="#58a6ff" font-size="8" opacity="0.35" font-family="sans-serif">Stem</text>
  <text class="nn-label" x="147" y="180" text-anchor="middle" fill="#58a6ff" font-size="8" opacity="0.35" font-family="sans-serif">Block 1</text>
  <text class="nn-label" x="222" y="180" text-anchor="middle" fill="#58a6ff" font-size="8" opacity="0.35" font-family="sans-serif">Block 2</text>
  <text class="nn-label" x="297" y="180" text-anchor="middle" fill="#58a6ff" font-size="8" opacity="0.35" font-family="sans-serif">Block 3</text>
  <text class="nn-label" x="370" y="180" text-anchor="middle" fill="#58a6ff" font-size="8" opacity="0.35" font-family="sans-serif">Pool+FC</text>

  <!-- F(x)+x label -->
  <text x="200" y="225" text-anchor="middle" fill="#58a6ff" font-size="10" opacity="0.5" font-family="monospace">y = F(x) + x</text>
</svg>
