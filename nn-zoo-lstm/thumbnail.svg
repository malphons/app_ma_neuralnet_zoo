<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- LSTM Thumbnail: Chain of gated cells -->

  <!-- Cell 1 -->
  <g class="nn-layer">
    <!-- Cell body -->
    <rect class="nn-node" x="30" y="60" width="80" height="100" rx="8" fill="#3fb950" opacity="0.15" stroke="#3fb950" stroke-width="1.5"/>
    <!-- Gates inside -->
    <rect x="38" y="75" width="18" height="16" rx="3" fill="#3fb950" opacity="0.5"/>
    <text x="47" y="87" text-anchor="middle" fill="#0d1117" font-size="8" font-family="monospace">f</text>
    <rect x="61" y="75" width="18" height="16" rx="3" fill="#3fb950" opacity="0.6"/>
    <text x="70" y="87" text-anchor="middle" fill="#0d1117" font-size="8" font-family="monospace">i</text>
    <rect x="84" y="75" width="18" height="16" rx="3" fill="#3fb950" opacity="0.7"/>
    <text x="93" y="87" text-anchor="middle" fill="#0d1117" font-size="8" font-family="monospace">o</text>
    <!-- Cell state line -->
    <line class="nn-edge" x1="30" y1="105" x2="110" y2="105" stroke="#3fb950" stroke-width="2" opacity="0.4"/>
    <text x="70" y="145" text-anchor="middle" fill="#3fb950" font-size="7" font-family="monospace" opacity="0.5">c_t-1</text>
  </g>

  <!-- Connection 1->2 -->
  <line class="nn-edge" x1="110" y1="105" x2="150" y2="105" stroke="#3fb950" stroke-width="1.5" opacity="0.3"/>
  <line class="nn-edge" x1="110" y1="130" x2="150" y2="130" stroke="#3fb950" stroke-width="1" opacity="0.2"/>

  <!-- Cell 2 -->
  <g class="nn-layer">
    <rect class="nn-node" x="150" y="60" width="80" height="100" rx="8" fill="#3fb950" opacity="0.25" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="158" y="75" width="18" height="16" rx="3" fill="#3fb950" opacity="0.5"/>
    <text x="167" y="87" text-anchor="middle" fill="#0d1117" font-size="8" font-family="monospace">f</text>
    <rect x="181" y="75" width="18" height="16" rx="3" fill="#3fb950" opacity="0.6"/>
    <text x="190" y="87" text-anchor="middle" fill="#0d1117" font-size="8" font-family="monospace">i</text>
    <rect x="204" y="75" width="18" height="16" rx="3" fill="#3fb950" opacity="0.7"/>
    <text x="213" y="87" text-anchor="middle" fill="#0d1117" font-size="8" font-family="monospace">o</text>
    <line class="nn-edge" x1="150" y1="105" x2="230" y2="105" stroke="#3fb950" stroke-width="2" opacity="0.5"/>
    <text x="190" y="145" text-anchor="middle" fill="#3fb950" font-size="7" font-family="monospace" opacity="0.5">c_t</text>
  </g>

  <!-- Connection 2->3 -->
  <line class="nn-edge" x1="230" y1="105" x2="270" y2="105" stroke="#3fb950" stroke-width="1.5" opacity="0.3"/>
  <line class="nn-edge" x1="230" y1="130" x2="270" y2="130" stroke="#3fb950" stroke-width="1" opacity="0.2"/>

  <!-- Cell 3 -->
  <g class="nn-layer">
    <rect class="nn-node" x="270" y="60" width="80" height="100" rx="8" fill="#3fb950" opacity="0.35" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="278" y="75" width="18" height="16" rx="3" fill="#3fb950" opacity="0.5"/>
    <text x="287" y="87" text-anchor="middle" fill="#0d1117" font-size="8" font-family="monospace">f</text>
    <rect x="301" y="75" width="18" height="16" rx="3" fill="#3fb950" opacity="0.6"/>
    <text x="310" y="87" text-anchor="middle" fill="#0d1117" font-size="8" font-family="monospace">i</text>
    <rect x="324" y="75" width="18" height="16" rx="3" fill="#3fb950" opacity="0.7"/>
    <text x="333" y="87" text-anchor="middle" fill="#0d1117" font-size="8" font-family="monospace">o</text>
    <line class="nn-edge" x1="270" y1="105" x2="350" y2="105" stroke="#3fb950" stroke-width="2" opacity="0.6"/>
    <text x="310" y="145" text-anchor="middle" fill="#3fb950" font-size="7" font-family="monospace" opacity="0.5">c_t+1</text>
  </g>

  <!-- Input arrows -->
  <line class="nn-edge" x1="70" y1="195" x2="70" y2="162" stroke="#3fb950" stroke-width="1" opacity="0.25"/>
  <line class="nn-edge" x1="190" y1="195" x2="190" y2="162" stroke="#3fb950" stroke-width="1" opacity="0.3"/>
  <line class="nn-edge" x1="310" y1="195" x2="310" y2="162" stroke="#3fb950" stroke-width="1" opacity="0.35"/>

  <!-- Output arrows -->
  <line class="nn-edge" x1="70" y1="58" x2="70" y2="30" stroke="#3fb950" stroke-width="1" opacity="0.25"/>
  <line class="nn-edge" x1="190" y1="58" x2="190" y2="30" stroke="#3fb950" stroke-width="1" opacity="0.3"/>
  <line class="nn-edge" x1="310" y1="58" x2="310" y2="30" stroke="#3fb950" stroke-width="1" opacity="0.35"/>

  <!-- Labels -->
  <text class="nn-label" x="70" y="215" text-anchor="middle" fill="#3fb950" font-size="9" opacity="0.4" font-family="sans-serif">x_t-1</text>
  <text class="nn-label" x="190" y="215" text-anchor="middle" fill="#3fb950" font-size="9" opacity="0.4" font-family="sans-serif">x_t</text>
  <text class="nn-label" x="310" y="215" text-anchor="middle" fill="#3fb950" font-size="9" opacity="0.4" font-family="sans-serif">x_t+1</text>
  <text class="nn-label" x="70" y="22" text-anchor="middle" fill="#3fb950" font-size="9" opacity="0.4" font-family="sans-serif">h_t-1</text>
  <text class="nn-label" x="190" y="22" text-anchor="middle" fill="#3fb950" font-size="9" opacity="0.4" font-family="sans-serif">h_t</text>
  <text class="nn-label" x="310" y="22" text-anchor="middle" fill="#3fb950" font-size="9" opacity="0.4" font-family="sans-serif">h_t+1</text>
</svg>
