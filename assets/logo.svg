<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Neural network logo: 3 layers of connected nodes -->
  <!-- Input layer -->
  <circle cx="6" cy="8" r="2.5" fill="currentColor" opacity="0.6"/>
  <circle cx="6" cy="16" r="2.5" fill="currentColor" opacity="0.6"/>
  <circle cx="6" cy="24" r="2.5" fill="currentColor" opacity="0.6"/>
  <!-- Hidden layer -->
  <circle cx="16" cy="10" r="2.5" fill="currentColor" opacity="0.8"/>
  <circle cx="16" cy="22" r="2.5" fill="currentColor" opacity="0.8"/>
  <!-- Output layer -->
  <circle cx="26" cy="16" r="2.5" fill="currentColor"/>
  <!-- Connections: input to hidden -->
  <line x1="8.5" y1="8" x2="13.5" y2="10" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
  <line x1="8.5" y1="8" x2="13.5" y2="22" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
  <line x1="8.5" y1="16" x2="13.5" y2="10" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
  <line x1="8.5" y1="16" x2="13.5" y2="22" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
  <line x1="8.5" y1="24" x2="13.5" y2="10" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
  <line x1="8.5" y1="24" x2="13.5" y2="22" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
  <!-- Connections: hidden to output -->
  <line x1="18.5" y1="10" x2="23.5" y2="16" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
  <line x1="18.5" y1="22" x2="23.5" y2="16" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
</svg>
