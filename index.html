<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Zoo</title>
    <meta name="description" content="An interactive visual gallery of common neural network architectures. Explore, learn, and dive deep into CNNs, RNNs, Transformers, GANs, and more.">

    <!-- Styles -->
    <link rel="stylesheet" href="css/zoo.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/cards.css">

    <!-- Favicon -->
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body>

    <!-- Header -->
    <header class="zoo-header">
        <div class="zoo-header__inner">
            <a href="./" class="zoo-header__brand">
                <img src="assets/logo.svg" alt="" class="zoo-header__logo">
                <span class="zoo-header__title">Neural Network Zoo</span>
            </a>

            <div class="zoo-header__actions">
                <!-- Theme toggle -->
                <button class="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark theme">
                    <!-- Sun icon (shown in light mode) -->
                    <svg class="theme-toggle__sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <!-- Moon icon (shown in dark mode) -->
                    <svg class="theme-toggle__moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>

                <!-- GitHub link -->
                <a href="https://github.com/malphons/xProject_NNZoo" class="github-link" target="_blank" rel="noopener noreferrer" title="View on GitHub">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <!-- Search & Filters -->
    <section class="zoo-search">
        <div class="zoo-search__bar">
            <svg class="zoo-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" class="zoo-search__input" placeholder="Search architectures by name, type, or concept..." autocomplete="off" spellcheck="false">
        </div>

        <div class="zoo-filters">
            <span class="zoo-filters__label">Filter:</span>
            <!-- Pills rendered by search.js -->
        </div>

        <div class="zoo-search__results">
            <span class="zoo-search__count"></span>
            <select class="zoo-search__sort" aria-label="Sort architectures">
                <option value="name">Sort: A-Z</option>
                <option value="year-asc">Sort: Oldest first</option>
                <option value="year-desc">Sort: Newest first</option>
                <option value="complexity">Sort: Complexity</option>
            </select>
        </div>
    </section>

    <!-- Card Grid -->
    <main class="zoo-grid">
        <!-- Cards rendered by gallery.js -->
    </main>

    <!-- Footer -->
    <footer class="zoo-footer">
        <p>Neural Network Zoo &mdash; An interactive guide to neural network architectures</p>
        <p>Each architecture lives in its own repo. <a href="https://github.com/malphons/xProject_NNZoo" target="_blank" rel="noopener noreferrer">Contribute on GitHub</a></p>
    </footer>

    <!-- Scripts (order matters: registry -> gallery -> search -> app) -->
    <script src="js/registry.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/search.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
