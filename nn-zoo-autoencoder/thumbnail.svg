<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Autoencoder Thumbnail: Symmetric hourglass -->

  <!-- Encoder connections -->
  <g class="nn-layer">
    <line class="nn-edge" x1="55" y1="35" x2="125" y2="55" stroke="#f778ba" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="55" y1="35" x2="125" y2="105" stroke="#f778ba" stroke-width="1" opacity="0.12"/>
    <line class="nn-edge" x1="55" y1="35" x2="125" y2="155" stroke="#f778ba" stroke-width="1" opacity="0.08"/>
    <line class="nn-edge" x1="55" y1="85" x2="125" y2="55" stroke="#f778ba" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="55" y1="85" x2="125" y2="105" stroke="#f778ba" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="55" y1="85" x2="125" y2="155" stroke="#f778ba" stroke-width="1" opacity="0.12"/>
    <line class="nn-edge" x1="55" y1="135" x2="125" y2="55" stroke="#f778ba" stroke-width="1" opacity="0.1"/>
    <line class="nn-edge" x1="55" y1="135" x2="125" y2="105" stroke="#f778ba" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="55" y1="135" x2="125" y2="155" stroke="#f778ba" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="55" y1="185" x2="125" y2="55" stroke="#f778ba" stroke-width="1" opacity="0.08"/>
    <line class="nn-edge" x1="55" y1="185" x2="125" y2="105" stroke="#f778ba" stroke-width="1" opacity="0.12"/>
    <line class="nn-edge" x1="55" y1="185" x2="125" y2="155" stroke="#f778ba" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="55" y1="215" x2="125" y2="105" stroke="#f778ba" stroke-width="1" opacity="0.1"/>
    <line class="nn-edge" x1="55" y1="215" x2="125" y2="155" stroke="#f778ba" stroke-width="1" opacity="0.12"/>
  </g>

  <!-- Encoder to bottleneck -->
  <g class="nn-layer">
    <line class="nn-edge" x1="140" y1="55" x2="200" y2="105" stroke="#f778ba" stroke-width="1.2" opacity="0.25"/>
    <line class="nn-edge" x1="140" y1="55" x2="200" y2="145" stroke="#f778ba" stroke-width="1.2" opacity="0.15"/>
    <line class="nn-edge" x1="140" y1="105" x2="200" y2="105" stroke="#f778ba" stroke-width="1.2" opacity="0.3"/>
    <line class="nn-edge" x1="140" y1="105" x2="200" y2="145" stroke="#f778ba" stroke-width="1.2" opacity="0.25"/>
    <line class="nn-edge" x1="140" y1="155" x2="200" y2="105" stroke="#f778ba" stroke-width="1.2" opacity="0.15"/>
    <line class="nn-edge" x1="140" y1="155" x2="200" y2="145" stroke="#f778ba" stroke-width="1.2" opacity="0.25"/>
  </g>

  <!-- Bottleneck to decoder -->
  <g class="nn-layer">
    <line class="nn-edge" x1="215" y1="105" x2="275" y2="55" stroke="#f778ba" stroke-width="1.2" opacity="0.25"/>
    <line class="nn-edge" x1="215" y1="105" x2="275" y2="105" stroke="#f778ba" stroke-width="1.2" opacity="0.3"/>
    <line class="nn-edge" x1="215" y1="105" x2="275" y2="155" stroke="#f778ba" stroke-width="1.2" opacity="0.15"/>
    <line class="nn-edge" x1="215" y1="145" x2="275" y2="55" stroke="#f778ba" stroke-width="1.2" opacity="0.15"/>
    <line class="nn-edge" x1="215" y1="145" x2="275" y2="105" stroke="#f778ba" stroke-width="1.2" opacity="0.25"/>
    <line class="nn-edge" x1="215" y1="145" x2="275" y2="155" stroke="#f778ba" stroke-width="1.2" opacity="0.25"/>
  </g>

  <!-- Decoder connections -->
  <g class="nn-layer">
    <line class="nn-edge" x1="290" y1="55" x2="355" y2="35" stroke="#f778ba" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="290" y1="55" x2="355" y2="85" stroke="#f778ba" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="290" y1="55" x2="355" y2="135" stroke="#f778ba" stroke-width="1" opacity="0.1"/>
    <line class="nn-edge" x1="290" y1="105" x2="355" y2="85" stroke="#f778ba" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="290" y1="105" x2="355" y2="135" stroke="#f778ba" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="290" y1="105" x2="355" y2="185" stroke="#f778ba" stroke-width="1" opacity="0.12"/>
    <line class="nn-edge" x1="290" y1="155" x2="355" y2="135" stroke="#f778ba" stroke-width="1" opacity="0.2"/>
    <line class="nn-edge" x1="290" y1="155" x2="355" y2="185" stroke="#f778ba" stroke-width="1" opacity="0.15"/>
    <line class="nn-edge" x1="290" y1="155" x2="355" y2="215" stroke="#f778ba" stroke-width="1" opacity="0.12"/>
  </g>

  <!-- Input nodes (5) -->
  <circle class="nn-node" cx="45" cy="35" r="9" fill="#f778ba" opacity="0.35"/>
  <circle class="nn-node" cx="45" cy="85" r="9" fill="#f778ba" opacity="0.35"/>
  <circle class="nn-node" cx="45" cy="135" r="9" fill="#f778ba" opacity="0.35"/>
  <circle class="nn-node" cx="45" cy="185" r="9" fill="#f778ba" opacity="0.35"/>
  <circle class="nn-node" cx="45" cy="215" r="9" fill="#f778ba" opacity="0.35"/>

  <!-- Encoder nodes (3) -->
  <circle class="nn-node" cx="130" cy="55" r="9" fill="#f778ba" opacity="0.55"/>
  <circle class="nn-node" cx="130" cy="105" r="9" fill="#f778ba" opacity="0.55"/>
  <circle class="nn-node" cx="130" cy="155" r="9" fill="#f778ba" opacity="0.55"/>

  <!-- Bottleneck nodes (2) -->
  <circle class="nn-node" cx="207" cy="105" r="11" fill="#f778ba" opacity="0.9"/>
  <circle class="nn-node" cx="207" cy="145" r="11" fill="#f778ba" opacity="0.9"/>

  <!-- Decoder nodes (3) -->
  <circle class="nn-node" cx="280" cy="55" r="9" fill="#f778ba" opacity="0.55"/>
  <circle class="nn-node" cx="280" cy="105" r="9" fill="#f778ba" opacity="0.55"/>
  <circle class="nn-node" cx="280" cy="155" r="9" fill="#f778ba" opacity="0.55"/>

  <!-- Output nodes (5) -->
  <circle class="nn-node" cx="365" cy="35" r="9" fill="#f778ba" opacity="0.35"/>
  <circle class="nn-node" cx="365" cy="85" r="9" fill="#f778ba" opacity="0.35"/>
  <circle class="nn-node" cx="365" cy="135" r="9" fill="#f778ba" opacity="0.35"/>
  <circle class="nn-node" cx="365" cy="185" r="9" fill="#f778ba" opacity="0.35"/>
  <circle class="nn-node" cx="365" cy="215" r="9" fill="#f778ba" opacity="0.35"/>

  <!-- Labels -->
  <text class="nn-label" x="45" y="243" text-anchor="middle" fill="#f778ba" font-size="9" opacity="0.4" font-family="sans-serif">Input</text>
  <text class="nn-label" x="130" y="243" text-anchor="middle" fill="#f778ba" font-size="9" opacity="0.4" font-family="sans-serif">Encoder</text>
  <text class="nn-label" x="207" y="243" text-anchor="middle" fill="#f778ba" font-size="9" opacity="0.5" font-family="sans-serif">Latent</text>
  <text class="nn-label" x="280" y="243" text-anchor="middle" fill="#f778ba" font-size="9" opacity="0.4" font-family="sans-serif">Decoder</text>
  <text class="nn-label" x="365" y="243" text-anchor="middle" fill="#f778ba" font-size="9" opacity="0.4" font-family="sans-serif">Output</text>
</svg>
